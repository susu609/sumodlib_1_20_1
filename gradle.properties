org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Required on the current development machine because ForgeGradle certificate
# validation fails for maven.minecraftforge.net.
systemProp.net.minecraftforge.gradle.check.certs=false
# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
# Mojang official mappings
mapping_channel=official
mapping_version=1.20.1
# Library identity
mod_id=sumodlib
mod_name=Su Mod Lib
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=net.susu609.modlib
mod_authors=SuSu609
mod_description=Shared Minecraft Forge utilities for Su's mods.

# Maven Central (see PUBLISHING.md). The namespace is verified on the Central
# Portal; the Java packages (net.susu609.modlib) are unaffected by it.
maven_group_id=io.github.susu609
pom_url=https://github.com/susu609/sumodlib_1_20_1
pom_developer_id=susu609
pom_developer_name=SuSu609
pom_scm_connection=scm:git:git://github.com/susu609/sumodlib_1_20_1.git
pom_scm_developer_connection=scm:git:ssh://git@github.com/susu609/sumodlib_1_20_1.git
# Central requires a license in the POM. Choose one and uncomment, for example:
# pom_license_name=The MIT License
# pom_license_url=https://opensource.org/license/mit
